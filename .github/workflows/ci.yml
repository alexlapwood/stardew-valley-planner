name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: a workflow-level cancel would also kill a running deploy.
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ci:test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ci:build

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/__temp/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: check
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://stardewplanner.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out firebase.json
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node for firebase-tools
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARDEW_VALLEY_PLANNER }}
          projectId: stardew-valley-planner
          channelId: live
