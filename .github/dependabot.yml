version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      lint-tools:
        patterns:
          - oxlint
          - oxlint-tsgolint
          - oxfmt
          - eslint-plugin-*
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
